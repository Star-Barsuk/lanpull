# lanpull Rust workspace.
# Quality and security policy lives in `[workspace.lints]` below and in the
# sibling static-analysis configuration files (rustfmt.toml, clippy.toml,
# deny.toml, .cargo/audit.toml). `make ci` runs every gate.
#
# The code is split into four crates so the core can be tested without the
# network and the CLI stays a thin shell:
#   lanpull-core   configuration, policy, glob/ignore, accounts, TLS, state, error
#   lanpull-store  share walk, manifests, cache, bundle, status
#   lanpull-http   the HTTPS server and its request handlers
#   lanpull-cli    the `lanpull` binary

[workspace]
members = ["crates/core", "crates/store", "crates/http", "crates/cli"]
resolver = "2"

[workspace.package]
categories = ["command-line-utilities", "network-programming"]
edition = "2021"
keywords = ["file-transfer", "https", "lan", "backup"]
license = "MIT"
readme = "../../README.md"
repository = "https://github.com/Star-Barsuk/lanpull"
rust-version = "1.88"
version = "1.0.0"

[workspace.dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.23.1"
clap = { version = "4.5.61", features = ["derive"] }
criterion = { version = "0.5.1", default-features = false, features = ["cargo_bench_support"] }
hex = "0.4.3"
humantime = "2.4.0"
libc = "0.2.189"
rand = "0.9"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.21"
time = { version = "0.3.44", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "fs",
    "time",
    "net",
    "io-util",
] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = [
    "fs",
    "limit",
    "timeout",
    "catch-panic",
    "set-header",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

# Dev-only.
http-body-util = "0.1.5"
proptest = "1.11.0"
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
strip = "symbols"

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
missing_debug_implementations = "warn"
missing_docs = "deny"
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_lifetimes = "deny"
unused_qualifications = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
missing_crate_level_docs = "warn"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
arithmetic_side_effects = "deny"
await_holding_lock = "deny"
cargo = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
if_let_mutex = "deny"
incompatible_msrv = "deny"
indexing_slicing = "deny"
missing_assert_message = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
nursery = { level = "warn", priority = -1 }
panic = "deny"
panic_in_result_fn = "deny"
pedantic = { level = "warn", priority = -1 }
print_stderr = "deny"
print_stdout = "deny"
similar_names = "allow"
string_slice = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"
# Transitive duplicates in third-party dependencies are accepted; cargo-deny
# still checks duplicates on the actual musl build graph.
multiple_crate_versions = "allow"
