# cargo-about configuration for THIRD_PARTY_LICENSES.md.
#
# The accepted list mirrors the license allowlist in server/deny.toml.
# Only the shipped graph is considered: the musl target, no dev dependencies,
# no build-only dependencies, and no private workspace crates.

accepted = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
]

targets = ["x86_64-unknown-linux-musl"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
